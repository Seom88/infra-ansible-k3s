- name: Check the control node and the cluster configuration
  hosts: server
  gather_facts: false
  become: false

  tasks:
    - name: Require an ansible-core new enough for the k3s collection
      ansible.builtin.assert:
        that:
          - ansible_version.full is version('2.15', '>=')
        fail_msg: >-
          This repository needs ansible-core 2.15 or newer, because the k3s
          collection uses features and filter plugins that do not exist in
          anything older. This control node runs
          {{ ansible_version.full }}. Upgrade the ansible that runs this
          playbook; no node has been contacted.

- name: Prepare the AlmaLinux node for k3s and Longhorn
  hosts: managed_nodes
  become: true
  gather_facts: true
  pre_tasks:
    - name: Put /usr/local/bin on the sudo secure_path so k3s is reachable
      ansible.builtin.lineinfile:
        path: /etc/sudoers
        regexp: '^Defaults(\s)*secure_path(\s)*='
        line: "Defaults    secure_path = /sbin:/bin:/usr/sbin:/usr/bin:/usr/local/bin"
        state: present
        insertafter: EOF
        validate: 'visudo -cf %s'

  roles:
    - role: base
    - role: firewalld
    - role: kernel_modules
    - role: cockpit

- name: Install the k3s server with the upstream collection
  hosts: server
  become: true
  gather_facts: true

  pre_tasks:
    - name: Collect the service facts k3s_server reads when joining a cluster
      ansible.builtin.service_facts:

  roles:
    - role: k3s.orchestration.k3s_server

  post_tasks:
    - name: Keep the k3s server config root-only, it holds the join token
      ansible.builtin.file:
        path: /etc/rancher/k3s/config.yaml
        mode: "0600"

- name: Join the k3s agents with the upstream collection
  hosts: agent
  become: true
  gather_facts: true

  roles:
    - role: k3s.orchestration.k3s_agent

  post_tasks:
    - name: Keep the k3s agent config root-only, it can hold a join token
      ansible.builtin.file:
        path: /etc/rancher/k3s/config.yaml
        mode: "0600"
      when: agent_config_yaml is defined

- name: Install the Cilium CNI from the pinned Helm chart
  hosts: server
  become: true
  gather_facts: false
  roles:
    - role: cilium

- name: Prepare the host for Longhorn
  hosts: managed_nodes
  become: true
  gather_facts: true
  roles:
    - role: longhorn_prereqs

- name: Install Argo CD from the pinned Helm chart, internal-only
  hosts: server
  become: true
  gather_facts: false
  roles:
    - role: argocd
