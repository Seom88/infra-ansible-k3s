all:
  children:
    k3s_cluster:
      children:
        server:
          hosts:
            k3s-01:
              ansible_host: "100.96.189.24"
              ansible_user: "ansible"
        agent:
          hosts: {}
      vars:
        api_endpoint: >-
          {{ hostvars[groups['server'][0]]['ansible_host']
             | default(groups['server'][0]) }}

    managed_nodes:
      children:
        k3s_cluster:
        nas:

    hypervisors:
      hosts:
        k3s-01:

    # Hosts that own NAS disks and therefore run the `zfs` role. Only list
    # hosts with disks here (and set zfs_pools in group_vars/nas); a
    # k3s-only node must never inherit OpenZFS.
    nas:
      hosts:
        k3s-01:

