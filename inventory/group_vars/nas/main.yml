---
# OpenZFS configuration for hosts in the `nas` group.
# The role is inert until a host is added to that group in inventory/hosts.yml.

zfs_enabled: true

# Existing mirror previously used by the TrueNAS VM. Import it on the host;
# do not create a new pool or format these disks.
# These are hints for the preflight check only: ZFS matches the pool members by
# the GUIDs in their own labels, not by these paths (see `zpool status -g` and
# `zdb -l`). Both USB-SATA bridges report the same generic serial, but the
# drives do expose their own WWN over the bridge, so prefer `wwn-*` over
# `usb-*`: the WWN comes from the drive, not from the adapter.
zfs_import_pools:
  - name: Data
    force: true  # ZFS reports it was last accessed from another system (the VM).
    devices:
      - /dev/disk/by-id/wwn-0x50014ee65d873771-part1   # HGST HTS541010B7E610
      - /dev/disk/by-id/wwn-0x5000039812d824a4-part1   # TOSHIBA MQ01ABD100

# Data is natively encrypted (AES-256-GCM); keyformat was verified as hex.
# The secret zfs_dataset_key is defined only in the encrypted vault.yml.
zfs_key_enabled: true
zfs_key_dataset: Data
zfs_key_format: hex

# Use this only to create a genuinely new pool. Never put the existing disks
# above here: `zpool create` would overwrite their current pool metadata.
zfs_pools: []

# Keep datasets unchanged for the first import; configure them after inspecting
# the existing pool's datasets and mountpoints.
zfs_datasets: []

zfs_scrub_calendar: "Sun *-*-* 03:00:00"

# RustFS uses rootful Podman Quadlet and the existing ZFS pool directories.
# Enable only after adding credentials to the encrypted vault.yml.
rustfs_enabled: true
rustfs_data_root: /Data/Docker/rustfs
rustfs_console_enable: "true"
rustfs_console_cors_allowed_origins: "*"
