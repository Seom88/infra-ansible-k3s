cilium_chart_repo_name: cilium
cilium_chart_repo_url: https://helm.cilium.io/
cilium_chart_name: cilium
cilium_chart_version: "1.20.2"

cilium_release_name: cilium

cilium_namespace: kube-system

cilium_helm_binary: helm
cilium_kubeconfig: /etc/rancher/k3s/k3s.yaml
cilium_kube_context: default

cilium_wait: true
cilium_wait_timeout: 600s
cilium_history_max: 10

# Gateway API CRDs — prerequisite for gatewayAPI.enabled=true.
# Per https://docs.cilium.io/en/stable/network/servicemesh/gateway-api/gateway-api/#installation
# Cilium does NOT install gateway.networking.k8s.io CRDs; install them before helm.
cilium_gateway_api_version: "v1.6.3"
cilium_gateway_api_channel: standard
