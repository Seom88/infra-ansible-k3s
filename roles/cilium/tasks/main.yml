# https://github.com/cilium/cilium/issues/47591 (vpn + cilium)
- name: Accept local-source packets on Cilium lxc interfaces (Tailscale src_valid_mark vs Cilium L7 proxy)
  ansible.builtin.copy:
    dest: /etc/sysctl.d/90-accept_local.conf
    content: |
      net.ipv4.conf.all.accept_local = 0
      -net.ipv4.conf.lxc*.accept_local = 1
    owner: root
    group: root
    mode: "0644"
  register: cilium_accept_local_sysctl

# A handler would defer this until the end of the play, but the sysctl must
# be active before the Cilium Helm install runs later in this same play.
- name: Apply the accept_local sysctl now
  ansible.builtin.command: systemd-sysctl
  changed_when: true
  when: cilium_accept_local_sysctl is changed  # noqa no-handler

- name: Check whether the Helm CLI this role drives is on the node
  ansible.builtin.command:
    cmd: "{{ cilium_helm_binary }} version --short"
  register: cilium_helm_probe
  changed_when: false
  failed_when: false
  check_mode: false

- name: Fail with the fix instead of installing the Helm CLI silently
  ansible.builtin.assert:
    that:
      - cilium_helm_probe.rc == 0
    fail_msg: "Helm CLI '{{ cilium_helm_binary }}' is missing on this node; install Helm or point cilium_helm_binary at an existing binary."

- name: Check that k3s has written the kubeconfig this role authenticates with
  ansible.builtin.stat:
    path: "{{ cilium_kubeconfig }}"
  register: cilium_kubeconfig_stat

- name: Fail before touching the cluster when k3s is not installed yet
  ansible.builtin.assert:
    that:
      - cilium_kubeconfig_stat.stat.exists
    fail_msg: "{{ cilium_kubeconfig }} does not exist; run the k3s server play of site.yml first."

- name: Ensure the Cilium namespace exists
  ansible.builtin.command:
    cmd: kubectl create namespace {{ cilium_namespace }}
  environment:
    KUBECONFIG: "{{ cilium_kubeconfig }}"
  register: cilium_namespace_create
  changed_when: cilium_namespace_create.rc == 0
  failed_when: >-
    cilium_namespace_create.rc != 0
    and 'AlreadyExists' not in cilium_namespace_create.stderr

- name: Make sure the Cilium chart repository is registered
  kubernetes.core.helm_repository:
    binary_path: "{{ cilium_helm_binary }}"
    repo_name: "{{ cilium_chart_repo_name }}"
    repo_url: "{{ cilium_chart_repo_url }}"
    repo_state: present

- name: Refresh the Cilium chart repository index so new chart versions resolve
  ansible.builtin.command:
    cmd: "{{ cilium_helm_binary }} repo update {{ cilium_chart_repo_name }}"
  changed_when: false

- name: Load Helm values
  ansible.builtin.set_fact:
    cilium_values: "{{ lookup('ansible.builtin.file', inventory_dir ~ '/../values/cilium/values.yaml') | from_yaml }}"

- name: Install Gateway API CRDs required by gatewayAPI.enabled
  ansible.builtin.command:
    cmd: >-
      kubectl apply --server-side --force-conflicts
      -f https://github.com/kubernetes-sigs/gateway-api/releases/download/{{ cilium_gateway_api_version }}/{{ cilium_gateway_api_channel }}-install.yaml
  environment:
    KUBECONFIG: "{{ cilium_kubeconfig }}"
  register: cilium_gateway_api_crds
  changed_when: >-
    'created' in cilium_gateway_api_crds.stdout
    or 'configured' in cilium_gateway_api_crds.stdout
    or 'serverside-applied' in cilium_gateway_api_crds.stdout
  failed_when: cilium_gateway_api_crds.rc != 0

- name: Install or upgrade the Cilium release
  kubernetes.core.helm:
    binary_path: "{{ cilium_helm_binary }}"
    kubeconfig: "{{ cilium_kubeconfig }}"
    context: "{{ cilium_kube_context }}"
    release_name: "{{ cilium_release_name }}"
    release_namespace: "{{ cilium_namespace }}"
    release_state: present
    release_values: "{{ cilium_values }}"
    chart_ref: "{{ cilium_chart_repo_name }}/{{ cilium_chart_name }}"
    chart_version: "{{ cilium_chart_version }}"
    wait: "{{ cilium_wait }}"
    timeout: "{{ cilium_wait_timeout }}"
    history_max: "{{ cilium_history_max }}"
