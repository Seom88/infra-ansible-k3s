---
- name: Refuse to run where OpenZFS is not wanted
  ansible.builtin.assert:
    that:
      - zfs_enabled | bool
      - ansible_facts['distribution'] in ['AlmaLinux', 'Rocky', 'RedHat', 'CentOS']
      - ansible_facts['distribution_major_version'] is version('9', '>=')
    fail_msg: >-
      The zfs role targets EL9/EL10 hosts and only runs where zfs_enabled is
      true. Apply it through plays/nas.yml to the `nas` group.

# --- Repositories and packages ----------------------------------------------
- name: Download the OpenZFS signing key
  ansible.builtin.get_url:
    url: "{{ zfs_gpg_key_url }}"
    dest: "{{ zfs_gpg_key_file }}"
    owner: root
    group: root
    mode: "0644"

- name: Import the OpenZFS signing key
  # Fingerprint from the OpenZFS docs (signing key2, EL9+). rpm_key refuses to
  # import the key if it does not match, so this doubles as a supply-chain check.
  ansible.builtin.rpm_key:
    key: "{{ zfs_gpg_key_file }}"
    fingerprint: "{{ zfs_gpg_key_fingerprint }}"
    state: present

- name: Drop the unsigned zfs-release RPM when present
  # It only shipped the repo file and key; both are managed by this role now.
  ansible.builtin.dnf:
    name: zfs-release
    state: absent

- name: Deploy the OpenZFS repository definition
  ansible.builtin.template:
    src: zfs.repo.j2
    dest: "{{ zfs_repo_file }}"
    owner: root
    group: root
    mode: "0644"

# sign-file lives in kernel-devel; the running kernel needs its matching build
# even when kmod-zfs is already compiled for it.
- name: Install kernel-devel for the running kernel
  ansible.builtin.dnf:
    name: "kernel-devel-{{ ansible_facts['kernel'] }}"
    state: present
  register: zfs_kernel_devel
  failed_when: false

- name: Install the OpenZFS packages
  ansible.builtin.dnf:
    name: "{{ zfs_packages }}"
    state: present

- name: Install hdparm for pool-disk power management
  ansible.builtin.dnf:
    name: hdparm
    state: present
  when: zfs_disk_apm_enabled | bool

# --- Secure Boot state --------------------------------------------------------
- name: Read the Secure Boot state
  ansible.builtin.command: mokutil --sb-state
  register: zfs_sb_state
  changed_when: false
  failed_when: false

- name: Record whether Secure Boot is enforced
  ansible.builtin.set_fact:
    zfs_secureboot: "{{ 'SecureBoot enabled' in (zfs_sb_state.stdout | default('')) }}"

# --- Local MOK and module signing ---------------------------------------------
- name: Ensure the MOK directory exists
  ansible.builtin.file:
    path: "{{ zfs_mok_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Generate the local module-signing keypair
  ansible.builtin.command:
    cmd: >-
      openssl req -x509 -newkey rsa:2048 -nodes
      -keyout {{ zfs_mok_key }}
      -outform DER -out {{ zfs_mok_cert }}
      -days {{ zfs_mok_days }}
      -subj "/CN={{ zfs_mok_common_name }}/"
    creates: "{{ zfs_mok_cert }}"

- name: Keep the private key root-only
  ansible.builtin.file:
    path: "{{ zfs_mok_key }}"
    owner: root
    group: root
    mode: "0600"

- name: Ensure the helper script directory exists
  ansible.builtin.file:
    path: "{{ zfs_script_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Deploy the module-signing script
  ansible.builtin.template:
    src: sign-zfs-modules.sh.j2
    dest: "{{ zfs_script_dir }}/sign-zfs-modules.sh"
    owner: root
    group: root
    mode: "0750"

- name: Sign the OpenZFS modules with the local MOK
  ansible.builtin.command:
    cmd: "{{ zfs_script_dir }}/sign-zfs-modules.sh --all"
  register: zfs_signing
  changed_when: "'signed ' in zfs_signing.stdout"

- name: Import the local MOK (only when explicitly requested)
  ansible.builtin.assert:
    that:
      - zfs_mok_password is defined
      - zfs_mok_password | length > 0
    fail_msg: >-
      zfs_mok_import is true but zfs_mok_password is empty. Supply the one-time
      MokManager password (vault or --extra-vars) or leave zfs_mok_import false
      and run `mokutil --import` by hand.
  when: zfs_mok_import | bool

- name: Import the local MOK into the firmware keyring
  ansible.builtin.command:
    cmd: "mokutil --import {{ zfs_mok_cert }}"
    stdin: "{{ zfs_mok_password }}\n{{ zfs_mok_password }}\n"
  when: zfs_mok_import | bool
  no_log: true

- name: Read the enrolled MOK certificates
  ansible.builtin.command: mokutil --list-enrolled
  register: zfs_mok_enrolled_list
  changed_when: false
  failed_when: false

- name: Record whether the local MOK is already enrolled
  ansible.builtin.set_fact:
    zfs_mok_enrolled: "{{ zfs_mok_common_name in (zfs_mok_enrolled_list.stdout | default('')) }}"

- name: Require the encrypted pool key from Ansible Vault
  ansible.builtin.assert:
    that:
      - zfs_dataset_key is defined
      - zfs_dataset_key | string | length > 0
    fail_msg: >-
      Define zfs_dataset_key in inventory/group_vars/nas/vault.yml using
      Ansible Vault; do not put the key in plaintext inventory.
  when: zfs_key_enabled | bool

- name: Ensure the local pool-key directory exists
  ansible.builtin.file:
    path: "{{ zfs_key_file | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0700"
  when: zfs_key_enabled | bool

- name: Install the encrypted-pool key from Ansible Vault
  ansible.builtin.copy:
    content: "{{ zfs_dataset_key }}"
    dest: "{{ zfs_key_file }}"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  diff: false
  when: zfs_key_enabled | bool

# --- Module load --------------------------------------------------------------
- name: Load the ZFS module
  ansible.builtin.command: modprobe zfs
  when:
    - not zfs_secureboot | bool or zfs_mok_enrolled | bool

- name: Load the ZFS module at boot
  ansible.builtin.copy:
    dest: /etc/modules-load.d/zfs.conf
    content: "zfs\n"
    owner: root
    group: root
    mode: "0644"
  when:
    - zfs_load_module_at_boot | bool
    - not zfs_secureboot | bool or zfs_mok_enrolled | bool

# --- Pools and datasets -------------------------------------------------------
- name: Check whether zpool is available
  ansible.builtin.command: zpool list -H -o name
  register: zfs_existing_pools
  changed_when: false
  failed_when: false

# Only `zpool create` needs every device to be present up front. Import hints
# are intentionally allowed to be absent: a mirror with one disk unplugged is
# still importable and must not be blocked (or, worse, recreated).
- name: Verify every device for a pool to be created exists
  ansible.builtin.stat:
    path: "{{ item.1 }}"
  loop: "{{ zfs_pools | subelements('devices', skip_missing=True) }}"
  register: zfs_pool_devices
  when: zfs_pools | length > 0

- name: Refuse to create pools from missing or non-by-id devices
  ansible.builtin.assert:
    that:
      - item.stat.exists
      - "'/dev/disk/by-id/' in item.item.1"
    fail_msg: >-
      Device {{ item.item.1 }} for new pool {{ item.item.0.name }} is missing
      or does not use a /dev/disk/by-id/ path. Refusing to run `zpool create`:
      /dev/sdX changes across boots and USB re-enumeration.
  loop: "{{ zfs_pool_devices.results | default([]) }}"
  loop_control:
    label: "{{ item.item.1 }}"

- name: Refuse import hints that are not stable by-id paths
  ansible.builtin.assert:
    that:
      - "'/dev/disk/by-id/' in item.1"
    fail_msg: >-
      Import hint {{ item.1 }} for pool {{ item.0.name }} does not use a
      /dev/disk/by-id/ path. Use a stable name, never /dev/sdX.
  loop: "{{ zfs_import_pools | subelements('devices', skip_missing=True) }}"
  loop_control:
    label: "{{ item.1 }}"
  when: zfs_import_pools | length > 0

- name: Import pools that exist on disk but are not imported
  ansible.builtin.command:
    cmd: "zpool import -a{% if zfs_key_enabled | bool %} -N{% endif %}"
  when:
    - zfs_import_all | default(false) | bool
    - zfs_existing_pools.rc != 0 or zfs_existing_pools.stdout_lines | length == 0

- name: Check read-only state of configured pools already imported
  ansible.builtin.command:
    cmd: "zpool get -H -o value readonly {{ item.name }}"
  loop: "{{ zfs_import_pools }}"
  loop_control:
    label: "{{ item.name }}"
  register: zfs_pool_readonly
  changed_when: false
  failed_when: false
  when: zfs_key_enabled | bool

- name: Export configured pools imported read-only for safe read-only inspection
  ansible.builtin.command:
    cmd: "zpool export {{ item.item.name }}"
  loop: "{{ zfs_pool_readonly.results | default([]) }}"
  loop_control:
    label: "{{ item.item.name }}"
  when:
    - zfs_key_enabled | bool
    - item.rc == 0
    - item.stdout | trim == 'on'

- name: Refresh the imported-pool list before targeted imports
  ansible.builtin.command: zpool list -H -o name
  register: zfs_existing_pools
  changed_when: false
  failed_when: false

- name: Import configured existing pools
  ansible.builtin.command:
    cmd: >-
      zpool import
      {% if item.force | default(false) | bool %}-f{% endif %}
      -d /dev/disk/by-id
      -o cachefile=/etc/zfs/zpool.cache
      {% if zfs_key_enabled | bool %}-N{% endif %}
      {{ item.name }}
  loop: "{{ zfs_import_pools }}"
  loop_control:
    label: "{{ item.name }}"
  when: item.name not in (zfs_existing_pools.stdout_lines | default([]))
  # This imports an existing pool only; it never creates or formats devices.

- name: Refresh the list of imported pools
  ansible.builtin.command: zpool list -H -o name
  register: zfs_existing_pools
  changed_when: false
  failed_when: false

# --- Disk power management ---------------------------------------------------
# Import hints point at partitions (-part1); hdparm needs the whole-disk
# device, so strip the partition suffix and de-duplicate the result.
- name: Collect the whole-disk paths backing the configured pools
  ansible.builtin.set_fact:
    zfs_apm_devices: >-
      {{ ((zfs_pools | selectattr('devices', 'defined')
           | map(attribute='devices') | flatten)
          + (zfs_import_pools | selectattr('devices', 'defined')
             | map(attribute='devices') | flatten))
         | map('regex_replace', '-part[0-9]+$', '')
         | unique | list }}
  when: zfs_disk_apm_enabled | bool

- name: Deploy the pool-disk power-management helper
  ansible.builtin.template:
    src: set-disk-apm.sh.j2
    dest: "{{ zfs_script_dir }}/set-disk-apm.sh"
    owner: root
    group: root
    mode: "0750"
  when: zfs_disk_apm_enabled | bool

- name: Deploy the pool-disk power-management udev rule
  ansible.builtin.template:
    src: zfs-disk-apm.rules.j2
    dest: /etc/udev/rules.d/99-zfs-disk-apm.rules
    owner: root
    group: root
    mode: "0644"
  when: zfs_disk_apm_enabled | bool
  notify: reload udev rules

# Runtime settings are re-applied on every run: the drive does not persist the
# standby timeout across a power cycle, so the play must not pretend `ok` means
# the current state is already correct.
- name: Apply APM and disable standby on the pool disks present now
  ansible.builtin.command:
    cmd: "{{ zfs_script_dir }}/set-disk-apm.sh"
  changed_when: false
  when: zfs_disk_apm_enabled | bool

- name: Read the configured encrypted dataset key format
  ansible.builtin.command:
    cmd: "zfs get -H -o value keyformat {{ zfs_key_dataset }}"
  register: zfs_keyformat_result
  changed_when: false
  when: zfs_key_enabled | bool

- name: Ensure the vault key format matches the pool
  ansible.builtin.assert:
    that:
      - zfs_keyformat_result.stdout | trim == zfs_key_format
    fail_msg: >-
      Pool {{ zfs_key_dataset }} expects keyformat
      {{ zfs_keyformat_result.stdout | trim }}, but Ansible is configured for
      {{ zfs_key_format }}. Refusing to try the key with a mismatched format.
  when: zfs_key_enabled | bool

- name: Deploy the encrypted-pool unlock helper
  ansible.builtin.template:
    src: unlock-pool.sh.j2
    dest: "{{ zfs_script_dir }}/unlock-pool.sh"
    owner: root
    group: root
    mode: "0750"
  when: zfs_key_enabled | bool

- name: Deploy the encrypted-pool unlock systemd service
  ansible.builtin.template:
    src: zfs-unlock-pool.service.j2
    dest: /etc/systemd/system/zfs-unlock-pool.service
    owner: root
    group: root
    mode: "0644"
  when: zfs_key_enabled | bool

- name: Enable and run the encrypted-pool unlock service
  ansible.builtin.systemd:
    name: zfs-unlock-pool.service
    enabled: true
    state: started
    daemon_reload: true
  when: zfs_key_enabled | bool

- name: Create the configured pools
  ansible.builtin.command:
    cmd: >-
      zpool create
      {% for key, value in (item.properties | default({})).items() -%}
      -o {{ key }}={{ value }}
      {% endfor -%}
      {{ item.name }}
      {% if item.type | default('stripe') != 'stripe' %}{{ item.type }}{% endif %}
      {{ item.devices | join(' ') }}
  loop: "{{ zfs_pools }}"
  loop_control:
    label: "{{ item.name }}"
  when: item.name not in (zfs_existing_pools.stdout_lines | default([]))

- name: Read the existing datasets
  ansible.builtin.command: zfs list -H -o name
  register: zfs_existing_datasets
  changed_when: false
  failed_when: false

- name: Create the configured datasets
  ansible.builtin.command:
    cmd: >-
      zfs create
      {% for key, value in (item.properties | default({})).items() -%}
      -o {{ key }}={{ value }}
      {% endfor -%}
      {{ item.name }}
  loop: "{{ zfs_datasets }}"
  loop_control:
    label: "{{ item.name }}"
  when: item.name not in (zfs_existing_datasets.stdout_lines | default([]))

# --- Degraded-pool recovery ---------------------------------------------------
# A USB disk re-enumerated after boot shows up in /dev/disk/by-id again, but
# ZFS keeps the old vdev UNAVAIL until it is explicitly onlined. Do that here,
# then fail loud if redundancy is still missing.
- name: Collect the configured pool names
  ansible.builtin.set_fact:
    zfs_configured_pool_names: >-
      {{ (zfs_import_pools | map(attribute='name') | list)
         + (zfs_pools | map(attribute='name') | list) }}

- name: Find unavailable members of the configured pools
  ansible.builtin.shell:
    cmd: "zpool status -g -P {{ item }} | awk '$2 == \"UNAVAIL\" { print $1 }'"
  loop: "{{ zfs_configured_pool_names }}"
  register: zfs_unavailable_members
  changed_when: false
  failed_when: false
  when: zfs_configured_pool_names | length > 0

- name: Bring unavailable members back online when the kernel sees them again
  ansible.builtin.command:
    cmd: "zpool online {{ item.0.item }} {{ item.1 }}"
  loop: >-
    {{ zfs_unavailable_members.results | default([])
       | subelements('stdout_lines', skip_missing=True) }}
  loop_control:
    label: "{{ item.0.item }} {{ item.1 }}"
  register: zfs_online_attempts
  changed_when: zfs_online_attempts.rc == 0
  failed_when: false
  when: zfs_auto_online | bool

- name: Read the health of each configured pool
  ansible.builtin.command:
    cmd: "zpool list -H -o health {{ item }}"
  loop: "{{ zfs_configured_pool_names }}"
  register: zfs_pool_health
  changed_when: false
  failed_when: false
  when: zfs_configured_pool_names | length > 0

- name: Require every configured pool to be ONLINE
  ansible.builtin.assert:
    that:
      - item.stdout | trim == 'ONLINE'
    fail_msg: >-
      Pool {{ item.item }} is {{ item.stdout | trim }}, not ONLINE, and could
      not be recovered automatically. The role only onlines members ZFS
      already knows; it never replaces or formats a device. Check that the
      disk is physically attached (`lsblk -o NAME,SERIAL,MODEL,TRAN`,
      `dmesg -T | tail`) and inspect `zpool status -v {{ item.item }}`. If the
      label is invalid, replace the member explicitly with
      `zpool replace {{ item.item }} <old-vdev> <new-by-id-path>`.
  loop: "{{ zfs_pool_health.results | default([]) }}"
  loop_control:
    label: "{{ item.item }}"
  when: zfs_require_healthy | bool

# --- Scheduled scrub ----------------------------------------------------------
- name: Refuse an unparseable scrub calendar
  ansible.builtin.command:
    cmd: systemd-analyze calendar "{{ zfs_scrub_calendar }}"
  register: zfs_scrub_calendar_check
  changed_when: false
  when: zfs_scrub_enabled | bool

- name: Deploy the scrub script
  ansible.builtin.template:
    src: scrub.sh.j2
    dest: "{{ zfs_script_dir }}/scrub.sh"
    owner: root
    group: root
    mode: "0750"
  when: zfs_scrub_enabled | bool

- name: Deploy the scrub service and timer
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - zfs-scrub.service
    - zfs-scrub.timer
  when: zfs_scrub_enabled | bool
  notify: systemd daemon-reload

- name: Enable the scrub timer
  ansible.builtin.systemd:
    name: zfs-scrub.timer
    enabled: true
    state: started
  when: zfs_scrub_enabled | bool

# --- Re-sign on updates -------------------------------------------------------
- name: Deploy the dnf re-sign hook
  ansible.builtin.template:
    src: zfs-sign.action.j2
    dest: /etc/dnf/plugins/post-transaction-actions.d/zfs-sign.action
    owner: root
    group: root
    mode: "0644"
  when: zfs_resign_on_update | bool

# --- Report -------------------------------------------------------------------
- name: Show the ZFS state this role converged to
  ansible.builtin.debug:
    msg:
      secureboot: "{{ zfs_secureboot }}"
      mok_enrolled: "{{ zfs_mok_enrolled }}"
      modules_signed: "{{ zfs_signing.stdout | default('already signed for every kernel') }}"
      kernel_devel: "{{ 'installed' if zfs_kernel_devel is not failed else 'MISSING for ' ~ ansible_facts['kernel'] ~ ' — link-time signing skipped' }}"
      pools: "{{ zfs_existing_pools.stdout_lines | default([]) }}"
      scrub: "{{ zfs_scrub_calendar if zfs_scrub_enabled | bool else 'disabled' }}"
      manual_step: >-
        {{ 'Enroll the MOK once: `mokutil --import ' ~ zfs_mok_cert ~ '`, reboot and confirm in MokManager. Until then the signed modules are rejected by Secure Boot.' if (zfs_secureboot | bool and not zfs_mok_enrolled | bool) else 'none' }}
