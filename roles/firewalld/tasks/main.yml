---

- name: Configure the host firewall for k3s
  when: firewalld_enabled | bool
  block:

    - name: Ensure firewalld is enabled and running
      ansible.builtin.systemd:
        name: "{{ firewalld_service }}"
        enabled: true
        state: started

    - name: Open the k3s and ingress ports in the active zone
      ansible.posix.firewalld:
        port: "{{ item }}"
        zone: "{{ firewalld_zone }}"
        permanent: true
        immediate: true
        state: enabled
      loop: "{{ firewalld_k3s_ports + firewalld_extra_ports }}"
      loop_control:
        label: "{{ item }}"

    - name: Open the Tailscale direct-connection port in the active zone
      ansible.posix.firewalld:
        port: "{{ item }}"
        zone: "{{ firewalld_zone }}"
        permanent: true
        immediate: true
        state: enabled
      loop: "{{ firewalld_tailscale_ports }}"
      loop_control:
        label: "{{ item }}"

    - name: Trust the pod, service and Tailscale source networks
      ansible.posix.firewalld:
        source: "{{ item }}"
        zone: trusted
        permanent: true
        immediate: true
        state: enabled
      loop: "{{ firewalld_trusted_sources }}"
      loop_control:
        label: "{{ item }}"

    - name: Enable masquerading in the active zone
      ansible.posix.firewalld:
        masquerade: true
        zone: "{{ firewalld_zone }}"
        permanent: true
        immediate: true
        state: enabled

    - name: Enable any additional firewalld services requested in group_vars
      ansible.posix.firewalld:
        service: "{{ item }}"
        zone: "{{ firewalld_zone }}"
        permanent: true
        immediate: true
        state: enabled
      loop: "{{ firewalld_extra_services }}"
      loop_control:
        label: "{{ item }}"

    - name: Validate the permanent firewalld configuration
      ansible.builtin.command:
        cmd: firewall-cmd --check-config
      register: firewalld_check_config
      changed_when: false
