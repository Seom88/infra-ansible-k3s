# Keep the uas (USB-attached SCSI) transport disabled for the Realtek RTL9201R
# bridges. That chip is stable as bulk-only transport (BOT), and UAS on it
# produces reset storms that drop TrueNAS passthrough.
usb_autosuspend_enabled: true

# Vendor:product pairs of the USB bridges to make power-stable.
usb_autosuspend_vendors:
  - "0bda:9201"

# Individual device smoothing for the kernel's autosuspend behaviour.
usb_autosuspend_power_control: "on"
usb_autosuspend_delay_ms: "-1"

# Force Bulk-Only Transport instead of UAS through a modprobe drop-in. The
# quirk is read when usb-storage loads, so an already-bound UAS device needs a
# reboot to switch transports (never reload the module under mounted disks).
usb_autosuspend_disable_uas: true
usb_autosuspend_modprobe_file: "/etc/modprobe.d/50-usb-rtl9201.conf"

# Stable host-side identifier for udev.
usb_autosuspend_udev_rules_file: "/etc/udev/rules.d/51-usb-autosuspend.rules"
usb_autosuspend_udev_rules_reload: true
usb_autosuspend_udev_rules_trigger: "usb"
