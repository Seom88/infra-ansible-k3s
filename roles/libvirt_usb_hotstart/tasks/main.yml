---
- name: Ensure script directory exists
  ansible.builtin.file:
    path: "{{ libvirt_usb_hotstart_script_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Deploy wait-and-start script
  ansible.builtin.template:
    src: wait-and-start.sh.j2
    dest: "{{ libvirt_usb_hotstart_script_dir }}/wait-and-start.sh"
    owner: root
    group: root
    mode: "0755"

- name: Deploy environment file for VM
  ansible.builtin.template:
    src: vm.env.j2
    dest: "{{ libvirt_usb_hotstart_script_dir }}/{{ libvirt_usb_hotstart_vm }}.env"
    owner: root
    group: root
    mode: "0640"

- name: Deploy systemd template unit
  ansible.builtin.template:
    src: libvirt-usb-hotstart@.service.j2
    dest: /etc/systemd/system/libvirt-usb-hotstart@.service
    owner: root
    group: root
    mode: "0644"
  notify: systemd daemon-reload

- name: Flush handlers (reload systemd before enabling units)
  ansible.builtin.meta: flush_handlers

- name: Disable libvirt autostart for the VM
  # virsh autostart --disable removes the symlink in /etc/libvirt/qemu/autostart/
  # that libvirtd would use to start the VM itself at boot.
  ansible.builtin.command:
    cmd: virsh autostart --disable {{ libvirt_usb_hotstart_vm }}
  register: _autostart_result
  changed_when: "'disabled' in _autostart_result.stdout or _autostart_result.rc == 0"
  failed_when: _autostart_result.rc != 0
  when: libvirt_usb_hotstart_disable_autostart | bool

- name: Enable and start the USB hotstart service for the VM
  ansible.builtin.systemd:
    name: "libvirt-usb-hotstart@{{ libvirt_usb_hotstart_vm }}.service"
    enabled: true
    state: started
    daemon_reload: false  # already done above

- name: Deploy XML address update script
  ansible.builtin.template:
    src: update-xml-addresses.py.j2
    dest: "{{ libvirt_usb_hotstart_script_dir }}/update-xml-addresses.py"
    owner: root
    group: root
    mode: "0750"

- name: Update USB hostdev addresses in VM XML to current boot enumeration
  ansible.builtin.command:
    cmd: python3 {{ libvirt_usb_hotstart_script_dir }}/update-xml-addresses.py {{ libvirt_usb_hotstart_vm }}
  register: _xml_update
  changed_when: "'changed' in _xml_update.stdout"
