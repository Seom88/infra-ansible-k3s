---
galaxy_info:
  role_name: libvirt_usb_hotstart
  author: local
  description: >
    Replaces libvirt VM autostart with a systemd service that waits for
    required USB devices (by VID:PID) to be enumerated before starting the VM.
    Eliminates boot failures caused by dynamic USB bus/device address changes.
  min_ansible_version: "2.14"

dependencies: []
