---
# VM whose USB hostdev devices need to be attached after enumeration.
libvirt_usb_hotstart_vm: "Truenas"

# USB vendor:product pairs to wait for before starting the VM.
# Must be ALL present for the VM to boot.
libvirt_usb_hotstart_devices:
  - vendor: "0bda"
    product: "9201"
    count: 2  # how many instances of this VID:PID must appear

# How long (seconds) to wait for USB devices before giving up.
libvirt_usb_hotstart_timeout: 60

# Disable libvirt autostart for the VM (the systemd unit replaces it).
libvirt_usb_hotstart_disable_autostart: true

# systemd unit name and paths.
libvirt_usb_hotstart_service: "libvirt-usb-hotstart@{{ libvirt_usb_hotstart_vm }}.service"
libvirt_usb_hotstart_script_dir: "/usr/local/lib/libvirt-usb-hotstart"
