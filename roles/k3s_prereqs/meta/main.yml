---
galaxy_info:
  role_name: k3s_prereqs
  namespace: infra_k3s
  author: infra-k3s
  description: >-
    k3s host prerequisites for an AlmaLinux node: Helm CLI with the pinned
    helm-diff plugin, kernel-modules-extra, socat, and the k3s firewall rules
    (k3s/ingress ports plus pod/service CIDRs in trusted). Runs before
    k3s_server on k3s_cluster hosts.
  license: MIT

  min_ansible_version: "2.19"
  platforms:
    - name: EL
      versions:
        - "9"
        - "10"
  galaxy_tags:
    - alma
    - almalinux
    - rhel
    - firewall
    - k3s

dependencies: []
