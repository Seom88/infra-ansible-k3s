galaxy_info:
  role_name: base
  namespace: infra_k3s
  author: infra-k3s
  description: >-
    Base OS layer for an AlmaLinux managed node: distribution guard rail,
    generic packages (curl, tar, git), time synchronisation, host facts, the
    common host firewall (daemon running, Tailscale port/interface,
    masquerade) and the Tailscale subnet router that advertises the node LAN
    into the tailnet. No k3s payload — that lives in k3s_prereqs.
  license: MIT
  min_ansible_version: "2.19"
  platforms:
    - name: EL
      versions:
        - "9"
        - "10"
  galaxy_tags:
    - alma
    - almalinux
    - rhel
    - k3s
    - base

dependencies: []
