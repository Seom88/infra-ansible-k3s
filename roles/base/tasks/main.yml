- name: Configure the base OS layer
  when: base_role_enabled | bool
  block:

    - name: Refuse to run on a distribution this repository was not written for
      ansible.builtin.assert:
        that:
          - ansible_facts['os_family'] == 'RedHat'
          - ansible_facts['distribution'] == 'AlmaLinux'
          - ansible_facts['distribution_major_version'] in base_supported_major_versions
        fail_msg: >-
          This repository targets AlmaLinux {{ base_supported_major_versions | join(' and ') }},
          not {{ ansible_facts['distribution'] }} {{ ansible_facts['distribution_version'] }}.

    - name: Install the base packages
      ansible.builtin.dnf:
        name: "{{ base_packages }}"
        state: present

    - name: Check whether the Helm CLI is already installed
      ansible.builtin.command: helm version --short
      register: base_helm_probe
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Download the official Helm installer script
      ansible.builtin.get_url:
        url: https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3
        dest: /tmp/get-helm-3
        mode: "0755"
      when: base_helm_probe.rc != 0

    - name: Install the Helm CLI
      ansible.builtin.command: bash /tmp/get-helm-3
      when: base_helm_probe.rc != 0
      changed_when: true

    # kubernetes.core.helm degrades its idempotency check without helm-diff installed.
    - name: Check the installed helm-diff plugin version
      ansible.builtin.command: helm plugin list
      register: base_helm_plugin_probe
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Record the installed helm-diff plugin version
      ansible.builtin.set_fact:
        base_helm_diff_installed_version: >-
          {{ base_helm_plugin_probe.stdout_lines
             | select('match', '^diff\s')
             | map('regex_replace', '^diff\s+(\S+).*', '\1')
             | list
             | default([''], true)
             | first }}

    - name: Remove the helm-diff plugin when it does not match the pinned version
      ansible.builtin.command: helm plugin uninstall diff
      when:
        - base_helm_diff_installed_version != ''
        - base_helm_diff_installed_version != base_helm_diff_version
      changed_when: true

    - name: Install the helm-diff plugin pinned to a known release
      ansible.builtin.command: >-
        helm plugin install https://github.com/databus23/helm-diff
        --version {{ base_helm_diff_git_tag }}
      when: base_helm_diff_installed_version != base_helm_diff_version
      changed_when: true

    - name: Install kernel-modules-extra pinned to the running kernel
      ansible.builtin.dnf:
        name: "{{ base_kernel_modules_extra_package }}-{{ ansible_facts['kernel'] }}"
        state: present
      register: base_kernel_modules_extra_pinned
      failed_when: false
      when: >-
        kernel_modules_extra_required_major is defined
        and ansible_facts['distribution_major_version'] | int
        >= kernel_modules_extra_required_major | int

    - name: Fall back to the unversioned kernel-modules-extra package
      ansible.builtin.dnf:
        name: "{{ base_kernel_modules_extra_package }}"
        state: present
      when: base_kernel_modules_extra_pinned.failed | default(false) | bool

    - name: Enable and start the time synchronisation service
      ansible.builtin.systemd:
        name: "{{ base_time_sync_service }}"
        enabled: true
        state: started

    - name: Record the AlmaLinux major version detected on this node
      ansible.builtin.set_fact:
        base_alma_major_version: "{{ ansible_facts['distribution_major_version'] }}"

    - name: Look for the cgroup v2 marker file
      ansible.builtin.stat:
        path: "{{ base_cgroup_v2_marker }}"
      register: base_cgroup_v2_probe

    - name: Record the cgroup version the node is running
      ansible.builtin.set_fact:
        base_cgroup_version: "{{ 2 if base_cgroup_v2_probe.stat.exists else 1 }}"

    - name: Record the SELinux enforcement status
      ansible.builtin.set_fact:
        base_selinux_status: >-
          {{ ansible_facts['selinux']['status'] | default('disabled', true)
             if ansible_facts['selinux'] | default(false) else 'disabled' }}
