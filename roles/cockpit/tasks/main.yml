- name: Prepare the Cockpit console on a node that already has it
  when: cockpit_role_enabled | bool
  block:
    - name: Read the installed package facts
      ansible.builtin.package_facts:
        manager: rpm

    - name: Refuse to run on a node without Cockpit installed
      ansible.builtin.assert:
        that:
          - "'cockpit' in (ansible_facts['packages'] | default({}))"
        fail_msg: >-
          The `cockpit` package is not installed on this host and this role does not install it;
          run 'dnf install cockpit' or set cockpit_role_enabled: false in group_vars.

    - name: Check whether a cockpit listener is active
      ansible.builtin.command: systemctl is-active cockpit.socket cockpit.service  # noqa: command-instead-of-module
      register: cockpit_listener
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Refuse to open the port for a listener that does not exist
      ansible.builtin.assert:
        that:
          - "'active' in cockpit_listener.stdout_lines"
        fail_msg: >-
          Neither cockpit.socket nor cockpit.service is active, so port 9090 would
          have no listener behind it; run 'systemctl enable --now cockpit.socket'
          and re-run this playbook.

    - name: Install the cockpit-machines plugin
      ansible.builtin.dnf:
        name: "{{ cockpit_packages }}"
        state: present

    - name: Install libvirt and qemu so the Machines page can create a VM
      ansible.builtin.dnf:
        name: "{{ libvirt_packages }}"
        state: present
      when: cockpit_install_libvirt | bool

    - name: Look for the libvirt socket units on this host
      ansible.builtin.stat:
        path: "{{ cockpit_systemd_unit_dir }}/{{ item }}"
      loop: "{{ cockpit_libvirt_socket_units }}"
      loop_control:
        label: "{{ item }}"
      register: cockpit_libvirt_unit_probe
      when: cockpit_install_libvirt | bool

    - name: Record which libvirt socket units are actually available
      ansible.builtin.set_fact:
        cockpit_libvirt_units_available: >-
          {{ cockpit_libvirt_unit_probe.results | default([])
             | selectattr('stat.exists') | map(attribute='item') | list }}
      when: cockpit_install_libvirt | bool

    - name: Enable and start the libvirt socket units
      ansible.builtin.systemd:
        name: "{{ item }}"
        enabled: true
        state: started
      loop: "{{ cockpit_libvirt_units_available | default([]) }}"
      loop_control:
        label: "{{ item }}"
      when: cockpit_install_libvirt | bool

    - name: Check that the libvirt sockets Cockpit needs are actually listening
      ansible.builtin.stat:
        path: "/run/libvirt/{{ item }}-sock"
      loop: "{{ cockpit_libvirt_required_sockets }}"
      loop_control:
        label: "{{ item }}"
      register: cockpit_libvirt_required_probe
      when: cockpit_install_libvirt | bool

    - name: Refuse to continue while a libvirt socket Cockpit needs is missing
      ansible.builtin.assert:
        that:
          - >-
            cockpit_libvirt_required_probe.results | default([])
            | rejectattr('stat.exists') | list | length == 0
        fail_msg: >-
          Cockpit's Machines page needs these libvirt sockets, which are not
          listening on this host:
          {{ cockpit_libvirt_required_probe.results | default([])
             | rejectattr('stat.exists') | map(attribute='item') | list
             | join(', ') }}.
          The matching libvirt driver package is missing (the `libvirt`
          metapackage pulls them in): install it and re-run this playbook.
      when: cockpit_install_libvirt | bool

- name: Open the Cockpit port in firewalld
  ansible.posix.firewalld:
    service: cockpit
    zone: "{{ cockpit_firewall_zone }}"
    permanent: true
    immediate: true
    state: enabled
  # base runs before virtualization, so firewalld is already up when this
  # runs; skip only when firewall management is disabled altogether.
  when: cockpit_role_enabled | bool and base_firewall_enabled | default(true) | bool

- name: Manage the libvirt storage pool for Cockpit Machines
  when: cockpit_role_enabled | bool and cockpit_libvirt_pool_enabled | bool
  block:
    - name: Ensure the libvirt pool directory exists
      ansible.builtin.file:
        path: "{{ cockpit_libvirt_pool_path }}"
        state: directory
        owner: root
        group: root
        mode: "0711"

    - name: Install the SELinux policy tools for the fcontext fix
      ansible.builtin.dnf:
        name: policycoreutils-python-utils
        state: present
      when:
        - cockpit_libvirt_pool_selinux_fix_enabled | bool
        - ansible_facts['selinux'] is defined and ansible_facts['selinux']['status'] == "enabled"

    - name: Check existing SELinux fcontext rules
      ansible.builtin.command: semanage fcontext -l  # noqa: command-instead-of-module
      register: cockpit_pool_fcontext_list
      changed_when: false
      failed_when: false
      check_mode: false
      when:
        - cockpit_libvirt_pool_selinux_fix_enabled | bool
        - ansible_facts['selinux'] is defined and ansible_facts['selinux']['status'] == "enabled"

    - name: Add SELinux fcontext rule for the libvirt pool path
      ansible.builtin.command: semanage fcontext -a -t virt_image_t "{{ cockpit_libvirt_pool_path }}(/.*)?"  # noqa: command-instead-of-module
      register: cockpit_pool_fcontext_add
      changed_when: cockpit_pool_fcontext_add.rc == 0
      failed_when: false
      when:
        - cockpit_libvirt_pool_selinux_fix_enabled | bool
        - ansible_facts['selinux'] is defined and ansible_facts['selinux']['status'] == "enabled"
        - >-
          cockpit_pool_fcontext_list is skipped
          or cockpit_pool_fcontext_list.rc | default(1) != 0
          or cockpit_pool_fcontext_list.stdout is not search(
            (cockpit_libvirt_pool_path | regex_escape) ~ '\(\/\.\*\)\?.*virt_image_t')

    - name: Update SELinux fcontext rule for the libvirt pool path on duplicate
      ansible.builtin.command: semanage fcontext -m -t virt_image_t "{{ cockpit_libvirt_pool_path }}(/.*)?"  # noqa: command-instead-of-module
      register: cockpit_pool_fcontext_modify
      changed_when: cockpit_pool_fcontext_modify.rc == 0
      when:
        - cockpit_libvirt_pool_selinux_fix_enabled | bool
        - ansible_facts['selinux'] is defined and ansible_facts['selinux']['status'] == "enabled"
        - cockpit_pool_fcontext_add.rc is defined and cockpit_pool_fcontext_add.rc != 0

    - name: Restore SELinux contexts under the libvirt pool path
      ansible.builtin.command: restorecon -Rv "{{ cockpit_libvirt_pool_path }}"  # noqa: command-instead-of-module
      register: cockpit_pool_restorecon
      changed_when: "'Relabeled' in cockpit_pool_restorecon.stdout"
      when:
        - cockpit_libvirt_pool_selinux_fix_enabled | bool
        - ansible_facts['selinux'] is defined and ansible_facts['selinux']['status'] == "enabled"

    - name: Check whether the libvirt pool is already defined
      ansible.builtin.command: virsh pool-info "{{ cockpit_libvirt_pool_name }}"  # noqa: command-instead-of-module
      register: cockpit_pool_info
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Define the libvirt pool
      ansible.builtin.command: >-  # noqa: command-instead-of-module
        virsh pool-define-as "{{ cockpit_libvirt_pool_name }}"
        dir --target "{{ cockpit_libvirt_pool_path }}"
      register: cockpit_pool_define
      changed_when: cockpit_pool_define.rc == 0
      when: cockpit_pool_info.rc != 0

    - name: Build the libvirt pool
      ansible.builtin.command: virsh pool-build "{{ cockpit_libvirt_pool_name }}"  # noqa: command-instead-of-module
      register: cockpit_pool_build
      changed_when: cockpit_pool_build.rc == 0
      failed_when: false
      when: cockpit_pool_info.rc != 0

    - name: Start the libvirt pool
      ansible.builtin.command: virsh pool-start "{{ cockpit_libvirt_pool_name }}"  # noqa: command-instead-of-module
      register: cockpit_pool_start
      changed_when: cockpit_pool_start.rc == 0
      when: cockpit_pool_info.rc != 0 or cockpit_pool_info.stdout is search('State:\s+inactive')

    - name: Enable autostart for the libvirt pool
      ansible.builtin.command: virsh pool-autostart "{{ cockpit_libvirt_pool_name }}"  # noqa: command-instead-of-module
      register: cockpit_pool_autostart_on
      changed_when: cockpit_pool_autostart_on.rc == 0
      when:
        - cockpit_libvirt_pool_autostart | bool
        - cockpit_pool_info.rc != 0 or cockpit_pool_info.stdout is search('Autostart:\s+no')

    - name: Disable autostart for the libvirt pool
      ansible.builtin.command: virsh pool-autostart "{{ cockpit_libvirt_pool_name }}" --disable  # noqa: command-instead-of-module
      register: cockpit_pool_autostart_off
      changed_when: cockpit_pool_autostart_off.rc == 0
      when:
        - not cockpit_libvirt_pool_autostart | bool
        - cockpit_pool_info.rc == 0
        - cockpit_pool_info.stdout is search('Autostart:\s+yes')
