cockpit_role_enabled: true

cockpit_packages:
  - cockpit-machines

cockpit_disallowed_users_file: /etc/cockpit/disallowed-users

# The libvirt client routes each API to the daemon that owns that driver, so
# every socket below is a separate connection point for Cockpit. Units whose
# package is not installed are skipped by the probe in tasks/main.yml.
cockpit_libvirt_socket_units:
  # Monolithic daemon (still shipped on EL9, absent on modular-only hosts)
  - libvirtd.socket
  - libvirtd-ro.socket
  # Support services
  - virtlogd.socket
  - virtlockd.socket
  - virtproxyd.socket
  # Modular driver daemons
  - virtqemud.socket
  - virtstoraged.socket
  - virtnetworkd.socket
  - virtnodedevd.socket
  - virtnwfilterd.socket
  - virtinterfaced.socket
  - virtsecretd.socket

# Minimum set Cockpit (cockpit-machines) needs to render its Machines page:
# domains, storage pools, networks and node devices.
cockpit_libvirt_required_sockets:
  - virtqemud
  - virtstoraged
  - virtnetworkd
  - virtnodedevd

cockpit_systemd_unit_dir: /usr/lib/systemd/system

cockpit_url_host: "{{ ansible_facts['hostname'] }}"

# Same zone base guarantees firewalld on; base runs before virtualization.
cockpit_firewall_zone: "{{ base_firewall_zone | default('public') }}"

# Tailscale Serve tunnel for the console. `https+insecure` is the
# pseudo-protocol the Tailscale docs prescribe for an HTTPS backend holding a
# self-signed certificate: tailscaled terminates TLS with a tailnet-issued
# certificate and skips certificate verification on the hop to 9090. The
# mapping is stored in tailscaled state, so it survives reboots.
cockpit_tailscale_serve_enabled: true
cockpit_tailscale_binary: /usr/bin/tailscale
cockpit_tailscale_serve_target: "https+insecure://localhost:9090"

cockpit_install_libvirt: true
libvirt_packages:  # noqa: var-naming[no-role-prefix]
  - libvirt
  - qemu-kvm
  - virt-install

# Libvirt storage pool backing Cockpit Machines (consumed by tasks/main.yml).
cockpit_libvirt_pool_enabled: true
cockpit_libvirt_pool_name: "default"
cockpit_libvirt_pool_path: "/home/libvirt/images"
cockpit_libvirt_pool_autostart: true
cockpit_libvirt_pool_selinux_fix_enabled: true
