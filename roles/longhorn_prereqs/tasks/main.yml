- name: Install the Longhorn host prerequisites
  when: longhorn_prereqs_enabled | bool
  block:
    - name: Refuse to run for a Data Engine this role cannot support
      ansible.builtin.assert:
        that:
          - longhorn_prereqs_data_engine | lower == 'v1'
        fail_msg: >-
          longhorn_prereqs_data_engine must be 'v1' ({{ longhorn_prereqs_data_engine }} given);
          this role prepares the host for the V1 Data Engine only.

    - name: Persist the Longhorn kernel modules so they load again on boot
      ansible.builtin.template:
        src: longhorn.conf.j2
        dest: "{{ longhorn_prereqs_modules_load_dir }}/{{ longhorn_prereqs_modules_conf_file }}"
        owner: root
        group: root
        mode: "0644"
      vars:
        longhorn_modules_to_load: "{{ longhorn_kernel_modules }}"

    # The packages come first: modinfo below must see any module a package ships,
    # otherwise a module that only exists after installation is misreported as
    # missing for the running kernel (a false "reboot required").
    - name: Install the Longhorn host packages
      ansible.builtin.dnf:
        name: "{{ longhorn_packages }}"
        state: present

    - name: Check which Longhorn modules exist for the kernel running right now
      ansible.builtin.command:
        cmd: modinfo -k {{ ansible_facts['kernel'] }} -F filename {{ item }}
      loop: "{{ longhorn_kernel_modules }}"
      loop_control:
        label: "{{ item }}"
      register: longhorn_prereqs_modinfo
      changed_when: false
      failed_when: false

    - name: Read the list of modules compiled into the running kernel
      ansible.builtin.slurp:
        src: "/lib/modules/{{ ansible_facts['kernel'] }}/modules.builtin"
      register: longhorn_prereqs_builtin_scan
      failed_when: false
      changed_when: false

    - name: Collect the names of the modules compiled into the running kernel
      ansible.builtin.set_fact:
        longhorn_prereqs_builtin_names: >-
          {{ (longhorn_prereqs_builtin_scan.content | default('') | b64decode).splitlines()
             | map('regex_replace', '^.*/', '')
             | map('regex_replace', '\.ko(\..*)?$', '')
             | map('regex_replace', '-', '_') | list }}

    - name: List the Longhorn modules that are not available for this kernel
      ansible.builtin.set_fact:
        longhorn_prereqs_modules_missing: >-
          {{ longhorn_prereqs_modinfo.results
             | selectattr('rc', 'ne', 0) | map(attribute='item') | list
             | difference(longhorn_prereqs_builtin_names) }}

    - name: Record whether a reboot is required before every module can load
      ansible.builtin.set_fact:
        longhorn_prereqs_reboot_required: "{{ longhorn_prereqs_modules_missing | length > 0 }}"

    # No failed_when here on purpose: a load that fails must surface as a failed
    # task with modprobe's own error instead of being silently swallowed.
    - name: Load the Longhorn kernel modules that are available for this kernel
      community.general.modprobe:
        name: "{{ item }}"
        state: present
      loop: "{{ longhorn_kernel_modules | difference(longhorn_prereqs_modules_missing) }}"
      loop_control:
        label: "{{ item }}"

    - name: Find the filesystem that backs the Longhorn data path
      ansible.builtin.command:
        cmd: "findmnt --noheadings --output FSTYPE --target {{ longhorn_prereqs_data_path }}"
      register: longhorn_prereqs_host_filesystem_probe
      changed_when: false
      failed_when: false

    - name: Record the filesystem type of the Longhorn data path
      ansible.builtin.set_fact:
        longhorn_prereqs_data_filesystem: >-
          {{ (longhorn_prereqs_host_filesystem_probe.stdout | default(''))
             | split() | first | default('unknown', true) }}

    - name: Refuse to continue on a filesystem Longhorn cannot store data on
      ansible.builtin.assert:
        that:
          - longhorn_prereqs_data_filesystem in longhorn_prereqs_supported_host_filesystems
        fail_msg: >-
          {{ longhorn_prereqs_data_path }} is on '{{ longhorn_prereqs_data_filesystem }}', which Longhorn cannot use;
          reformat as ext4/xfs or point longhorn_prereqs_data_path elsewhere.
      when: longhorn_prereqs_enforce_host_filesystem | bool

    - name: Enable and start the iSCSI initiator daemon
      ansible.builtin.systemd:
        name: "{{ longhorn_prereqs_iscsid_service }}"
        enabled: true
        state: started

    - name: Read the list of kernel modules currently loaded
      ansible.builtin.command:
        cmd: lsmod
      register: longhorn_prereqs_loaded_modules
      changed_when: false
      failed_when: false

    # lsmod lines are "name size refcount used_by", so only the first column may
    # be compared against bare module names; built-in modules never appear in
    # lsmod at all, so they are added from modules.builtin.
    - name: Collect the names of the modules loaded or built into this kernel
      ansible.builtin.set_fact:
        longhorn_prereqs_usable_module_names: >-
          {{ (longhorn_prereqs_loaded_modules.stdout_lines | default([]))
             | map('regex_replace', '\s.*$', '')
             | list
             | union(longhorn_prereqs_builtin_names) }}

    - name: Record which Longhorn modules are usable on this node
      ansible.builtin.set_fact:
        longhorn_prereqs_modules_loaded: >-
          {{ longhorn_kernel_modules
             | select('in', longhorn_prereqs_usable_module_names)
             | list }}

    - name: Fail if a Longhorn kernel module is neither loaded nor built in
      ansible.builtin.assert:
        that:
          - longhorn_prereqs_modules_loaded | length == longhorn_kernel_modules | length
        fail_msg: >-
          {% if longhorn_prereqs_modules_missing | length > 0 %}
          Longhorn kernel module(s) {{ longhorn_prereqs_modules_missing | join(', ') }} do not exist for
          kernel {{ ansible_facts['kernel'] }}; reboot the node, then re-run this playbook.
          {% else %}
          Longhorn kernel module(s) {{ longhorn_kernel_modules | difference(longhorn_prereqs_modules_loaded) | join(', ') }}
          exist for kernel {{ ansible_facts['kernel'] }} but are not loaded; check the modprobe task output
          above, or run 'modprobe <module>' on the node to see the real error.
          {% endif %}

    - name: Read the installed version of each Longhorn package
      ansible.builtin.package_facts:
        manager: rpm

    - name: Seed the installed package version report
      ansible.builtin.set_fact:
        longhorn_prereqs_packages_installed: ""

    - name: Record the installed version of each Longhorn package
      ansible.builtin.set_fact:
        longhorn_prereqs_packages_installed: >-
          {{ longhorn_prereqs_packages_installed ~ ' ' ~ item ~ '='
             ~ ((((ansible_facts['packages'][item] | first).version)
                 ~ '-' ~ ((ansible_facts['packages'][item] | first).release))
                if item in (ansible_facts['packages'] | default({}))
                else 'NOT INSTALLED') }}
      loop: "{{ longhorn_packages }}"
      loop_control:
        label: "{{ item }}"
